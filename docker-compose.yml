# Runs the image built by CI. For production, pin it as tag@sha256.
services:
  hp-150nw-monitor:
    image: ghcr.io/aledv/hp-150nw-monitor:${HP_MONITOR_TAG:-latest}
    container_name: hp-150nw-monitor
    restart: unless-stopped
    ports:
      - "${HP_MONITOR_BIND:-0.0.0.0}:${HP_MONITOR_PORT:-5001}:5001"
