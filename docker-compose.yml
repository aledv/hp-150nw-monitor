# Per provarlo altrove. Sul Raspberry Pi il compose effettivo, con l'immagine fissata (tag@sha256),
# sta in my_rpi_scripts/hp-150nw-monitor/.
services:
  hp-150nw-monitor:
    image: ghcr.io/aledv/hp-150nw-monitor:${HP_MONITOR_TAG:-latest}
    container_name: hp-150nw-monitor
    restart: unless-stopped
    ports:
      - "${HP_MONITOR_BIND:-0.0.0.0}:${HP_MONITOR_PORT:-5001}:5001"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
