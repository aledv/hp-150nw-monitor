# Linter (regola generale: lanciato in CI prima dei test). Locale: ruff check . && ruff format --check .
line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "UP"]

[lint.flake8-bugbear]
# FastAPI dichiara i parametri con File()/Form()/Query() nei default: è il modo previsto, non un errore
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]
